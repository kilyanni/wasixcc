name: Dispatch Wasinix Update

# A published wasixcc release means the wasinix pin can bump now instead of
# waiting for wasinix's weekly update schedule; this dispatches its update
# workflow for the wasixcc target.
#
# Requires the WASINIX_DISPATCH_TOKEN secret: a token with actions write
# access on wasix-org/wasinix. The default GITHUB_TOKEN cannot dispatch
# workflows in another repository.
on:
  # The Release workflow publishes the release with the default GITHUB_TOKEN,
  # whose events start no workflows, so a finished Release run is the real
  # trigger; the release event covers releases published by hand.
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Only a release that actually succeeded. Release also runs on
    # pull_request (version checks only, no publish), so ignore those.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - name: Dispatch the wasinix update workflow
        env:
          GH_TOKEN: ${{ secrets.WASINIX_DISPATCH_TOKEN }}
        run: gh workflow run update.yml --repo wasix-org/wasinix -f targets=wasixcc
